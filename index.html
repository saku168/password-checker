<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Checker</title><link rel="stylesheet" href="style.css"></head><body><main class="panel"><h1>Password Checker</h1><p>Check password criteria locally in your browser.</p><input id="password" type="password" placeholder="Enter a password" autocomplete="off"><div class="meter"><div id="bar"></div></div><p id="strength">Waiting for input...</p><ul><li data-check="length">At least 12 characters</li><li data-check="upper">An uppercase letter</li><li data-check="lower">A lowercase letter</li><li data-check="number">A number</li><li data-check="symbol">A symbol</li></ul><small>Local demo: your password is not stored or sent anywhere.</small></main><script src="script.js"></script></body></html>
